name: Build Docker Image

on:
  push:
    tags: ['prod*', 'stg*']

jobs:
  filter-path:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.filter-path.outputs.changes }}
    steps:
      - name: 'Checkout Source'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
      - name: 'Filter Changes'
        uses: 'dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d'
        id: 'filter-path'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: ./.github/utils/path-filter.yaml
  build:
    runs-on: ubuntu-24.04
    needs: filter-path
    if: ${{ needs.filter-path.outputs.services != '[]' && needs.filter-path.outputs.services != '' }}
    strategy:
      matrix:
        service: ${{ fromJson(needs.filter-path.outputs.services) }}
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
      - name: 'Login to Dockerhub'
        uses: 'docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 'Set up QEMU'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: 'Build and Push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          target: ${{ matrix.service }}
          build-args: |
            PACKAGE=@calendar/${{ matrix.service }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/calendar-${{ matrix.service }}:${{ github.ref_name }}
